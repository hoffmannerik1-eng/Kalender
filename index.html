<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0">
<title>Kalender Pro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#0b57d0;
  --blue2:#1a73e8;
  --bg:#f8fafd;
  --surface:#ffffff;
  --surface2:#f1f3f4;
  --text:#202124;
  --muted:#70757a;
  --border:#dadce0;
  --hour:64px;
  --danger:#d93025;
  --shadow:0 2px 10px rgba(60,64,67,.15);
}

body.dark{
  --bg:#111315;
  --surface:#1e2022;
  --surface2:#292c2f;
  --text:#e8eaed;
  --muted:#9aa0a6;
  --border:#3c4043;
  --shadow:0 3px 15px rgba(0,0,0,.4);
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* LOGIN */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%,rgba(26,115,232,.18),transparent 35%),
    radial-gradient(circle at 80% 80%,rgba(66,133,244,.12),transparent 35%),
    var(--bg);
}

.loginBox{
  width:min(420px,calc(100% - 30px));
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:28px;
  padding:34px;
  box-shadow:var(--shadow);
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}

.loginBox h1{
  font-size:29px;
  margin-bottom:8px;
}

.loginBox p{
  color:var(--muted);
  line-height:1.5;
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:14px 15px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:15px;
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px rgba(26,115,232,.12);
}

.primaryBtn{
  width:100%;
  border:0;
  background:var(--blue);
  color:#fff;
  padding:14px;
  border-radius:24px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primaryBtn:hover{
  filter:brightness(1.08);
}

.secondaryBtn{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  padding:13px;
  border-radius:24px;
  margin-top:10px;
  cursor:pointer;
}

#loginError{
  color:var(--danger);
  margin-top:14px;
  font-size:14px;
}

/* APP */

#app{
  display:none;
  width:100%;
  height:100%;
}

.app{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */

.topbar{
  height:72px;
  min-height:72px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 20px;
  position:relative;
  z-index:20;
}

.menuBtn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:25px;
  width:42px;
  height:42px;
  border-radius:50%;
  cursor:pointer;
}

.menuBtn:hover{
  background:var(--surface2);
}

.brand{
  font-size:21px;
  font-weight:500;
  white-space:nowrap;
}

.brand span{
  color:var(--blue2);
}

.todayBtn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:22px;
  padding:9px 18px;
  font-weight:bold;
  cursor:pointer;
}

.navBtns{
  display:flex;
  gap:3px;
}

.iconBtn{
  border:0;
  background:transparent;
  color:var(--text);
  width:40px;
  height:40px;
  border-radius:50%;
  cursor:pointer;
  font-size:19px;
}

.iconBtn:hover{
  background:var(--surface2);
}

.currentTitle{
  font-size:22px;
  margin-left:8px;
  white-space:nowrap;
}

.spacer{
  flex:1;
}

.searchBox{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface2);
  border-radius:24px;
  padding:0 14px;
  height:43px;
  width:250px;
}

.searchBox input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
}

.userArea{
  display:flex;
  align-items:center;
  gap:10px;
}

.userEmail{
  color:var(--muted);
  font-size:13px;
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* TOOLBAR */

.toolbar{
  height:58px;
  min-height:58px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:8px;
}

.viewSelector{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
}

.viewSelector option{
  background:var(--surface);
  color:var(--text);
}

.addBtn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:22px;
  padding:11px 19px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:var(--shadow);
}

.toolbarSpacer{
  flex:1;
}

.themeBtn,
.logoutBtn{
  border:0;
  background:transparent;
  color:var(--text);
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
}

.themeBtn:hover,
.logoutBtn:hover{
  background:var(--surface2);
}

/* CALENDAR */

.calendarArea{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
  background:var(--surface);
}

/* MONTH */

.monthView{
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
}

.monthWeekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  height:45px;
  border-bottom:1px solid var(--border);
  border-top:1px solid var(--border);
}

.monthWeekdays div{
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  font-size:12px;
  font-weight:bold;
}

.monthGrid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  grid-template-rows:repeat(6,1fr);
  min-height:0;
}

.monthCell{
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:5px;
  overflow:hidden;
  cursor:pointer;
  min-width:0;
}

.monthCell:hover{
  background:rgba(26,115,232,.035);
}

.monthDayNumber{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:13px;
  margin-bottom:3px;
}

.monthDayNumber.today{
  background:var(--blue);
  color:white;
}

.otherMonth{
  color:#9aa0a6;
}

.monthEvent{
  background:var(--blue);
  color:white;
  border-radius:4px;
  padding:3px 6px;
  margin:2px 0;
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  cursor:pointer;
}

/* TIME VIEW */

.timeView{
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  min-width:0;
}

.timeHeader{
  display:grid;
  grid-template-columns:72px 1fr;
  height:64px;
  min-height:64px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  z-index:5;
}

.timeHeaderDays{
  display:grid;
  min-width:0;
}

.dayHeader{
  border-left:1px solid var(--border);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:12px;
  color:var(--muted);
}

.dayHeader strong{
  margin-top:4px;
  font-size:17px;
  color:var(--text);
}

.dayHeader.today strong{
  background:var(--blue);
  color:white;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.timeScroll{
  flex:1;
  min-height:0;
  overflow:auto;
  position:relative;
}

.timeContent{
  position:relative;
  min-height:calc(24 * var(--hour));
}

.timeGrid{
  display:grid;
  grid-template-columns:72px 1fr;
  min-height:calc(24 * var(--hour));
}

.hours{
  position:relative;
}

.hourLabel{
  height:var(--hour);
  text-align:right;
  padding-right:12px;
  color:var(--muted);
  font-size:11px;
  transform:translateY(-7px);
}

.daysGrid{
  display:grid;
  position:relative;
  min-width:0;
}

.dayColumn{
  position:relative;
  border-left:1px solid var(--border);
  height:calc(24 * var(--hour));
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--hour) - 1px),
      var(--border) calc(var(--hour) - 1px),
      var(--border) var(--hour)
    );
  cursor:pointer;
}

.dayColumn:hover{
  background-color:rgba(26,115,232,.018);
}

/* HALF HOUR LINES */

.dayColumn::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:100%;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--hour)/2 - 1px),
      rgba(128,128,128,.18) calc(var(--hour)/2 - 1px),
      rgba(128,128,128,.18) calc(var(--hour)/2)
    );
  pointer-events:none;
}

/* EVENTS */

.event{
  position:absolute;
  left:5px;
  right:5px;
  border-radius:6px;
  padding:5px 7px;
  color:white;
  overflow:hidden;
  cursor:pointer;
  z-index:3;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  font-size:12px;
}

.event:hover{
  filter:brightness(1.08);
  z-index:10;
}

.eventTitle{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.eventTime{
  opacity:.9;
  font-size:11px;
  margin-top:2px;
}

.eventLocation{
  opacity:.9;
  font-size:10px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* NOW LINE */

.nowLine{
  position:absolute;
  height:2px;
  background:#ea4335;
  z-index:15;
  pointer-events:none;
}

.nowDot{
  width:10px;
  height:10px;
  background:#ea4335;
  border-radius:50%;
  position:absolute;
  left:-5px;
  top:-4px;
}

/* FAB */

.fab{
  position:absolute;
  right:25px;
  bottom:25px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:var(--blue);
  color:white;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  z-index:30;
}

/* MODAL */

.modalBackdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  color:var(--text);
  border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.modalHeader{
  padding:20px 24px 12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.modalHeader h2{
  flex:1;
  font-size:20px;
}

.closeBtn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:25px;
  cursor:pointer;
  width:38px;
  height:38px;
  border-radius:50%;
}

.closeBtn:hover{
  background:var(--surface2);
}

.modalBody{
  padding:10px 24px 24px;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.formGroup{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.formGroup.full{
  grid-column:1/-1;
}

.formGroup label{
  color:var(--muted);
  font-size:12px;
}

.formGroup input,
.formGroup select,
.formGroup textarea{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  padding:12px;
  outline:none;
  font-family:inherit;
}

.formGroup textarea{
  min-height:90px;
  resize:vertical;
}

.colorRow{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.colorChoice{
  width:30px;
  height:30px;
  border-radius:50%;
  border:3px solid transparent;
  cursor:pointer;
}

.colorChoice.selected{
  border-color:var(--text);
}

.modalFooter{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  padding:0 24px 24px;
}

.deleteBtn{
  margin-right:auto;
  border:0;
  background:transparent;
  color:var(--danger);
  padding:11px 15px;
  cursor:pointer;
  border-radius:8px;
}

.saveBtn{
  border:0;
  background:var(--blue);
  color:white;
  padding:11px 20px;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
}

.cancelBtn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
}

/* MOBILE */

.mobileNav{
  display:none;
}

@media(max-width:900px){
  .brand{
    display:none;
  }

  .searchBox{
    width:180px;
  }

  .userEmail{
    display:none;
  }
}

@media(max-width:700px){

  .topbar{
    height:62px;
    min-height:62px;
    padding:0 10px;
    gap:5px;
  }

  .todayBtn{
    padding:8px 12px;
  }

  .currentTitle{
    font-size:18px;
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .searchBox{
    display:none;
  }

  .userArea{
    margin-left:auto;
  }

  .toolbar{
    height:55px;
    min-height:55px;
    padding:0 10px;
  }

  .toolbar .themeBtn,
  .toolbar .logoutBtn{
    display:none;
  }

  .timeHeader{
    grid-template-columns:55px 1fr;
  }

  .timeGrid{
    grid-template-columns:55px 1fr;
  }

  .hourLabel{
    padding-right:7px;
    font-size:10px;
  }

  .dayHeader{
    font-size:10px;
  }

  .dayHeader strong{
    font-size:14px;
  }

  .fab{
    bottom:75px;
    right:18px;
  }

  .mobileNav{
    display:flex;
    height:60px;
    min-height:60px;
    background:var(--surface);
    border-top:1px solid var(--border);
    justify-content:space-around;
    align-items:center;
    z-index:50;
  }

  .mobileNav button{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:11px;
    display:flex;
    flex-direction:column;
    gap:3px;
    align-items:center;
  }

  .mobileNav button span{
    font-size:21px;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .formGroup.full{
    grid-column:auto;
  }
}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-thumb{
  background:#b7b7b7;
  border-radius:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">
  <div class="loginBox">
    <div class="logo">✓</div>

    <h1>Kalender Pro</h1>

    <p>
      Dein persönlicher Kalender mit Terminen,
      Uhrzeiten und Erinnerungen.
    </p>

    <input
      id="email"
      class="input"
      type="email"
      placeholder="E-Mail"
      autocomplete="email"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button class="primaryBtn" id="loginBtn">
      Anmelden
    </button>

    <button class="secondaryBtn" id="registerBtn">
      Neues Konto erstellen
    </button>

    <div id="loginError"></div>
  </div>
</div>


<!-- APP -->

<div id="app">

  <div class="app">

    <!-- TOPBAR -->

    <header class="topbar">

      <button class="menuBtn" id="menuBtn">☰</button>

      <div class="brand">
        Kalender <span>Pro</span>
      </div>

      <button class="todayBtn" id="todayBtn">
        Heute
      </button>

      <div class="navBtns">
        <button class="iconBtn" id="prevBtn">‹</button>
        <button class="iconBtn" id="nextBtn">›</button>
      </div>

      <div class="currentTitle" id="currentTitle">
        September 2026
      </div>

      <div class="spacer"></div>

      <div class="searchBox">
        🔍
        <input
          id="searchInput"
          placeholder="Suchen"
        >
      </div>

      <div class="userArea">
        <div class="userEmail" id="userEmail"></div>
        <div class="avatar" id="avatar">K</div>
      </div>

    </header>


    <!-- TOOLBAR -->

    <div class="toolbar">

      <button class="addBtn" id="addBtn">
        ＋ Erstellen
      </button>

      <select class="viewSelector" id="viewSelector">
        <option value="month">Monat</option>
        <option value="week">Woche</option>
        <option value="day">Tag</option>
      </select>

      <div class="toolbarSpacer"></div>

      <button class="themeBtn" id="themeBtn">
        ◐ Design
      </button>

      <button class="logoutBtn" id="logoutBtn">
        Abmelden
      </button>

    </div>


    <!-- CALENDAR AREA -->

    <main class="calendarArea">

      <!-- MONTH -->

      <section class="monthView" id="monthView">

        <div class="monthWeekdays">
          <div>SO</div>
          <div>MO</div>
          <div>DI</div>
          <div>MI</div>
          <div>DO</div>
          <div>FR</div>
          <div>SA</div>
        </div>

        <div class="monthGrid" id="monthGrid"></div>

      </section>


      <!-- TIME VIEW -->

      <section class="timeView" id="timeView">

        <div class="timeHeader">

          <div></div>

          <div
            class="timeHeaderDays"
            id="timeHeaderDays"
          ></div>

        </div>

        <div class="timeScroll" id="timeScroll">

          <div class="timeContent">

            <div class="timeGrid">

              <div class="hours" id="hours"></div>

              <div
                class="daysGrid"
                id="daysGrid"
              ></div>

            </div>

            <div
              class="nowLine"
              id="nowLine"
            >
              <div class="nowDot"></div>
            </div>

          </div>

        </div>

      </section>


      <button class="fab" id="fab">
        +
      </button>

    </main>


    <!-- MOBILE NAV -->

    <nav class="mobileNav">

      <button id="mobileToday">
        <span>⌂</span>
        Heute
      </button>

      <button id="mobileMonth">
        <span>▦</span>
        Monat
      </button>

      <button id="mobileWeek">
        <span>☷</span>
        Woche
      </button>

      <button id="mobileAdd">
        <span>＋</span>
        Termin
      </button>

    </nav>

  </div>

</div>


<!-- EVENT MODAL -->

<div class="modalBackdrop" id="modalBackdrop">

  <div class="modal">

    <div class="modalHeader">

      <h2 id="modalTitle">
        Termin erstellen
      </h2>

      <button
        class="closeBtn"
        id="closeModal"
      >
        ×
      </button>

    </div>

    <div class="modalBody">

      <div class="formGrid">

        <div class="formGroup full">

          <label>Titel</label>

          <input
            id="eventTitle"
            placeholder="z. B. Mathe lernen"
          >

        </div>


        <div class="formGroup">

          <label>Datum</label>

          <input
            id="eventDate"
            type="date"
          >

        </div>


        <div class="formGroup">

          <label>Wiederholung</label>

          <select id="eventRepeat">

            <option value="none">
              Keine
            </option>

            <option value="daily">
              Jeden Tag
            </option>

            <option value="weekly">
              Jede Woche
            </option>

            <option value="monthly">
              Jeden Monat
            </option>

          </select>

        </div>


        <div class="formGroup">

          <label>Start</label>

          <input
            id="eventStart"
            type="time"
            value="08:00"
          >

        </div>


        <div class="formGroup">

/* =========================================================

let currentUser = null;

let currentView = "month";

let selectedColor = "#1a73e8";


/* =========================================================
   HELPERS
   ========================================================= */

function pad(n){
  return String(n).padStart(2,"0");
}

function dateKey(date){

  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;

}

function formatMonth(date){

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      month:"long",
      year:"numeric"
    }
  ).format(date);

}

function formatLongDate(date){

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  ).format(date);

}

function startOfWeek(date){

  const d = new Date(date);

  const day = d.getDay();

  d.setDate(
    d.getDate() - day
  );

  d.setHours(0,0,0,0);

  return d;

}

function addDays(date,n){

  const d = new Date(date);

  d.setDate(
    d.getDate()+n
  );

  return d;

}

function minutesFromTime(time){

  if(!time) return 0;

  const [h,m] =
    time.split(":").map(Number);

  return h*60+m;

}

function isSameDay(a,b){

  return dateKey(a) === dateKey(b);

}

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   AUTH
   ========================================================= */

loginBtn.addEventListener(
  "click",
  async ()=>{

    loginError.textContent = "";

    try{

      await signInWithEmailAndPassword(
        auth,
        emailInput.value.trim(),
        passwordInput.value
      );

    }catch(error){

      loginError.textContent =
        readableAuthError(error);

    }

  }
);


registerBtn.addEventListener(
  "click",
  async ()=>{

    loginError.textContent = "";

    try{

      await createUserWithEmailAndPassword(
        auth,
        emailInput.value.trim(),
        passwordInput.value
      );

    }catch(error){

      loginError.textContent =
        readableAuthError(error);

    }

  }
);


function readableAuthError(error){

  const code =
    error?.code || "";

  if(
    code.includes("configuration-not-found")
  ){
    return "Firebase Auth ist noch nicht richtig eingerichtet. Aktiviere E-Mail/Passwort in Firebase Authentication.";
  }

  if(
    code.includes("invalid-credential") ||
    code.includes("wrong-password") ||
    code.includes("user-not-found")
  ){
    return "E-Mail oder Passwort ist falsch.";
  }

  if(
    code.includes("email-already-in-use")
  ){
    return "Diese E-Mail wird bereits verwendet.";
  }

  if(
    code.includes("weak-password")
  ){
    return "Das Passwort ist zu schwach.";
  }

  if(
    code.includes("invalid-email")
  ){
    return "Bitte eine gültige E-Mail eingeben.";
  }

  return error?.message ||
    "Anmeldung fehlgeschlagen.";

}


onAuthStateChanged(
  auth,
  user => {

    currentUser = user;

    if(user){

      loginScreen.style.display =
        "none";

      app.style.display =
        "block";

      userEmail.textContent =
        user.email || "";

      avatar.textContent =

          .toUpperCase();

      subscribeEvents();

      render();

    }else{

      loginScreen.style.display =
        "flex";

      app.style.display =
        "none";

      if(unsubscribeEvents){

        unsubscribeEvents();

        unsubscribeEvents = null;

      }

    }

  }
);


logoutBtn.addEventListener(
  "click",
  ()=>signOut(auth)
);


/* =========================================================
   FIRESTORE
   ========================================================= */

function subscribeEvents(){

  if(unsubscribeEvents){

    unsubscribeEvents();

  }

  const q = query(
    collection(db,"events"),
    where(
      "userId",
      "==",
      currentUser.uid
    )
  );

  unsubscribeEvents =
    onSnapshot(
      q,
      snapshot => {

        events =
          snapshot.docs.map(
            item => ({
              id:item.id,
              ...item.data()
            })
          );

        render();

      },
      error => {

        console.error(
          "Firestore:",
          error
        );

      }
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  currentTitle.textContent =
    getTitle();

  if(currentView === "month"){

    monthView.style.display =
      "flex";

    timeView.style.display =
      "none";

    renderMonth();

  }else{

    monthView.style.display =
      "none";

    timeView.style.display =
      "flex";

    renderTimeView();

  }

}


function getTitle(){

  if(currentView === "month"){

    return formatMonth(
      currentDate
    );

  }

  if(currentView === "day"){

    return formatLongDate(
      currentDate
    );

  }

  const start =
    startOfWeek(currentDate);

  const end =
    addDays(start,6);

  if(
    start.getMonth() === end.getMonth()
  ){

    return new Intl.DateTimeFormat(
      "de-DE",
      {
        month:"long",
        year:"numeric"
      }
    ).format(start);

  }

  return `${new Intl.DateTimeFormat(
    "de-DE",
    {day:"numeric",month:"short"}
  ).format(start)} – ${new Intl.DateTimeFormat(
    "de-DE",
    {day:"numeric",month:"short",year:"numeric"}
  ).format(end)}`;

}


/* =========================================================
   MONTH VIEW
   ========================================================= */

function renderMonth(){

  monthGrid.innerHTML = "";

  const year =
    currentDate.getFullYear();

  const month =
    currentDate.getMonth();

  const first =
    new Date(
      year,
      month,
      1
    );

  const start =
    new Date(first);

  start.setDate(
    1-first.getDay()
  );

  for(let i=0;i<42;i++){

    const date =
      addDays(start,i);

    const cell =
      document.createElement("div");

    cell.className =
      "monthCell";

    const number =
      document.createElement("div");

    number.className =
      "monthDayNumber";

    number.textContent =
      date.getDate();

    if(
      date.getMonth() !== month
    ){

      number.classList.add(
        "otherMonth"
      );

    }

    if(
      isSameDay(
        date,
        new Date()
      )
    ){

      number.classList.add(
        "today"
      );

    }

    cell.appendChild(number);


    const dayEvents =
      events
        .filter(
          e => e.date === dateKey(date)
        )
        .filter(
          matchesSearch
        )
        .sort(
          (a,b) =>
            minutesFromTime(a.start)
            -
            minutesFromTime(b.start)
        );


    dayEvents
      .slice(0,4)
      .forEach(
        event => {

          const el =
            document.createElement("div");

          el.className =
            "monthEvent";

          el.style.background =
            event.color ||
            "#1a73e8";

          el.textContent =
            `${event.start || ""} ${event.title}`;

          el.title =
            event.title;

          el.addEventListener(
            "click",
            e => {

              e.stopPropagation();

              openEvent(event);

            }
          );

          cell.appendChild(el);

        }
      );


    if(dayEvents.length > 4){

      const more =
        document.createElement("div");

      more.style.fontSize =
        "11px";

      more.style.color =
        "var(--muted)";

      more.textContent =
        `+ ${dayEvents.length-4} weitere`;

      cell.appendChild(more);

    }


    cell.addEventListener(
      "click",
      ()=>{

        openNewEvent(
          date,
          "09:00",
          "10:00"
        );

      }
    );

    monthGrid.appendChild(cell);

  }

}


/* =========================================================
   TIME VIEW
   ========================================================= */

function renderTimeView(){

  timeHeaderDays.innerHTML = "";

  daysGrid.innerHTML = "";

  hours.innerHTML = "";


  let numberOfDays =
    currentView === "day"
      ? 1
      : 7;


  let firstDate =
    currentView === "day"
      ? new Date(currentDate)
      : startOfWeek(currentDate);


  /* HOURS */

  for(let hour=0;hour<24;hour++){

    const label =
      document.createElement("div");

    label.className =
      "hourLabel";

    label.textContent =
      `${pad(hour)}:00`;

    hours.appendChild(label);

  }


  /* HEADER */

  timeHeaderDays.style.gridTemplateColumns =
    `repeat(${numberOfDays},minmax(120px,1fr))`;

  daysGrid.style.gridTemplateColumns =
    `repeat(${numberOfDays},minmax(120px,1fr))`;


  for(let i=0;i<numberOfDays;i++){

    const date =
      addDays(firstDate,i);

    const header =
      document.createElement("div");

    header.className =
      "dayHeader";

    if(
      isSameDay(
        date,
        new Date()
      )
    ){

      header.classList.add(
        "today"
      );

    }

    const weekday =
      new Intl.DateTimeFormat(
        "de-DE",
        {weekday:"short"}
      ).format(date);

    header.innerHTML = `
      <div>${weekday.toUpperCase()}</div>
      <strong>${date.getDate()}</strong>
    `;

    timeHeaderDays.appendChild(
      header
    );


    /* DAY COLUMN */

    const column =
      document.createElement("div");

    column.className =
      "dayColumn";

    column.dataset.date =
      dateKey(date);


    column.addEventListener(
      "click",
      event => {

        if(
          event.target !== column
        ) return;

        const rect =
          column.getBoundingClientRect();

        const y =
          event.clientY -
          rect.top +
          timeScroll.scrollTop;

        let minutes =
          Math.floor(
            y /
            parseFloat(
              getComputedStyle(
                document.documentElement
              ).getPropertyValue("--hour")
            ) *
            60
          );

        /* auf 15 Minuten runden */

        minutes =
          Math.round(minutes/15)*15;

        if(minutes >= 1440){

          minutes = 1425;

        }

        const start =
          `${pad(Math.floor(minutes/60))}:${pad(minutes%60)}`;

        const endMinutes =
          Math.min(
            minutes+60,
            1439
          );

        const end =
          `${pad(Math.floor(endMinutes/60))}:${pad(endMinutes%60)}`;

        openNewEvent(
          date,
          start,
          end
        );

      }
    );


    const dayEvents =
      events
        .filter(
          e =>
            e.date ===
            dateKey(date)
        )
        .filter(
          matchesSearch
        )
        .sort(
          (a,b) =>
            minutesFromTime(a.start)
            -
            minutesFromTime(b.start)
        );


    dayEvents.forEach(
      event => {

        renderTimeEvent(
          column,
          event
        );

      }
    );


    daysGrid.appendChild(
      column
    );

  }


  updateNowLine(
    firstDate,
    numberOfDays
  );


  /*
   Automatisch auf aktuelle Zeit scrollen.
   Nur wenn die heutige Ansicht geöffnet wird.
  */

  if(
    isTodayVisible(
      firstDate,
      numberOfDays
    )
  ){

    setTimeout(
      ()=>{

        const now =
          new Date();

        const minutes =
          now.getHours()*60 +
          now.getMinutes();

        const hourHeight =
          parseFloat(
            getComputedStyle(
              document.documentElement
            ).getPropertyValue(
              "--hour"
            )
          );

        timeScroll.scrollTop =
          Math.max(
            0,
            minutes/60*hourHeight - 180
          );

      },
      50
    );

  }

}


function renderTimeEvent(
  column,
  event
){

  const start =
    minutesFromTime(
      event.start
    );

  let end =
    minutesFromTime(
      event.end
    );

  if(end <= start){

    end =
      start+60;

  }

  const duration =
    Math.max(
      15,
      end-start
    );


  const hourHeight =
    parseFloat(
      getComputedStyle(
        document.documentElement
      ).getPropertyValue(
        "--hour"
      )
    );


  const el =
    document.createElement("div");

  el.className =
    "event";

  el.style.top =
    `${start/60*hourHeight}px`;

  el.style.height =
    `${Math.max(
      24,
      duration/60*hourHeight - 3
    )}px`;

  el.style.background =
    event.color ||
    "#1a73e8";


  el.innerHTML = `
    <div class="eventTitle">
      ${escapeHtml(event.title || "Termin")}
    </div>

    <div class="eventTime">
      ${escapeHtml(event.start || "")}
      –
      ${escapeHtml(event.end || "")}
    </div>

    ${
      event.location
      ? `<div class="eventLocation">📍 ${escapeHtml(event.location)}</div>`
      : ""
    }
  `;


  el.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      openEvent(event);

    }
  );


  column.appendChild(el);

}


/* =========================================================
   CURRENT TIME LINE
   ========================================================= */

function updateNowLine(
  firstDate,
  numberOfDays
){

  const now =
    new Date();

  const visible =
    isTodayVisible(
      firstDate,
      numberOfDays
    );

  nowLine.style.display =
    visible
      ? "block"
      : "none";

  if(!visible) return;

  const todayIndex =
    Math.round(
      (new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      ) - new Date(
        firstDate.getFullYear(),
        firstDate.getMonth(),
        firstDate.getDate()
      )) /
      86400000
    );

  const hourHeight =
    parseFloat(
      getComputedStyle(
        document.documentElement
      ).getPropertyValue(
        "--hour"
      )
    );

  const minutes =
    now.getHours()*60 +
    now.getMinutes();


  const top =
    minutes/60*hourHeight;


  const dayWidth =
    daysGrid.clientWidth /
    numberOfDays;


  const left =
    72 +
    todayIndex*dayWidth;


  nowLine.style.top =
    `${top}px`;

  nowLine.style.left =
    `${left}px`;

  nowLine.style.width =
    `${dayWidth}px`;

}


function isTodayVisible(
  firstDate,
  numberOfDays
){

  const today =
    new Date();

  for(
    let i=0;
    i<numberOfDays;
    i++
  ){

    if(
      isSameDay(
        addDays(firstDate,i),
        today
      )
    ){

      return true;

    }

  }

  return false;

}


/* =========================================================
   SEARCH
   ========================================================= */

function matchesSearch(event){

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!search) return true;

  return [
    event.title,
    event.location,
    event.description
  ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()
    .includes(search);

}

  .getElementById("searchInput")
  .addEventListener(

    render
  );

      if(currentView === "month"){

        );

      }else if(currentView === "week"){

        currentDate =
          addDays(
            currentDate,
            7
          );

      }else{

        currentDate =
          addDays(
            currentDate,
            1
          );

      }

      render();

    }
  );


viewSelector.addEventListener(
  "change",
  ()=>{

    currentView =
      viewSelector.value;

    render();

  }

function openNewEvent(
  date,
  start="09:00",
  end="10:00"
){

  editingEventId = null;

  modalTitle.textContent =
    "Termin erstellen";

  eventTitle.value =
    "";

  eventDate.value =
    dateKey(date);

  eventStart.value =

  eventEnd.value =
    end;

  eventRepeat.value =
    "none";

  eventReminder.value =
    "0";

  eventLocation.value =
    "";

  eventDescription.value =
    "";

  selectedColor =
    "#1a73e8";

  updateColorUI();

  deleteBtn.style.display =
    "none";

  modalBackdrop.style.display =
    "flex";

  setTimeout(
    ()=>eventTitle.focus(),
    50
  );

}


function openEvent(event){

  editingEventId =
    event.id;

  modalTitle.textContent =
    "Termin bearbeiten";

  eventTitle.value =
    event.title || "";

  eventDate.value =
    event.date || "";

  eventStart.value =
    event.start || "09:00";

  eventEnd.value =
    event.end || "10:00";

  eventRepeat.value =
    event.repeat || "none";

  eventReminder.value =
    String(
      event.reminder || 0
    );

  eventLocation.value =
    event.location || "";

  eventDescription.value =
    event.description || "";

  selectedColor =
    event.color ||
    "#1a73e8";

  updateColorUI();

  deleteBtn.style.display =
    "block";

  modalBackdrop.style.display =
    "flex";

}

}

document

/* COLORS */

document

function updateColorUI(){

  document
    .querySelectorAll(".colorChoice")
    .forEach(
      button => {

        button.classList.toggle(
          "selected",
          button.dataset.color ===
          selectedColor
        );

/* =========================================================
   SAVE EVENT
   ========================================================= */

saveBtn.addEventListener(
  "click",
  async ()=>{

    if(!currentUser) return;

    const title =
      eventTitle.value.trim();

    const date =
      eventDate.value;

    if(!title){

      alert(
        "Bitte einen Titel eingeben."
      );

      return;

    }

    if(!date){

      alert(
        "Bitte ein Datum auswählen."
      );

      return;

    }

    const data = {

      userId:
        currentUser.uid,

      title,

      date,

      start:
        eventStart.value,

      end:
        eventEnd.value,

      repeat:
        eventRepeat.value,

      reminder:
        Number(
          eventReminder.value
        ),

      location:
        eventLocation.value.trim(),

      description:
        eventDescription.value.trim(),

      color:
        selectedColor,

      updatedAt:
        serverTimestamp()

    };


    try{

      saveBtn.disabled =
        true;

      if(editingEventId){

        await updateDoc(
          doc(
            db,
            "events",
            editingEventId
          ),
          data
        );

      }else{

        await addDoc(
          collection(
            db,
            "events"
          ),
          {
            ...data,
            createdAt:
              serverTimestamp()
          }
        );

      }

      closeModal();

    }catch(error){

      console.error(error);

      alert(
        "Der Termin konnte nicht gespeichert werden."
      );

    }finally{

      saveBtn.disabled =
        false;

    }

  }
);

);

/* =========================================================
   REMINDER CHECK
   ========================================================= */

setInterval(
  checkReminders,
  30000
);


function checkReminders(){

  if(
    !currentUser ||
    !("Notification" in window)
  ){

    return;

  }

  if(
    Notification.permission !==
      "granted"
  ){

    return;

  }

  const now =
    new Date();

  const today =
    dateKey(now);

  events.forEach(
    event => {

      if(
        event.date !== today ||
        !event.reminder
      ){

        return;

      }

      const eventMinutes =
        minutesFromTime(
          event.start
        );

      const nowMinutes =
        now.getHours()*60 +
        now.getMinutes();

      const reminderAt =
        eventMinutes -
        Number(event.reminder);


      if(
        nowMinutes === reminderAt
      ){

        const key =
          `reminder-${event.id}-${today}-${event.start}`;

        if(
          sessionStorage.getItem(key)
        ){

          return;

        }

        sessionStorage.setItem(
          key,
          "1"
        );

        new Notification(
          event.title,
          {
            body:
              `${event.start} Uhr` +
              (
                event.location
                  ? ` · ${event.location}`
                  : ""
              ),
            icon:""
          }
        );

      }

    }
  );

}

   ========================================================= */

    if(

          ? 1
          : 7;

      const firstDate =
        currentView === "day"
          ? new Date(currentDate)
          : startOfWeek(currentDate);

      updateNowLine(
        firstDate,
        numberOfDays
      );

    }

  },
  30000
);
